<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Smart Messaging Gateway</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 36px 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 440px;
            border: 1px solid #e2e8f0;
        }

        .icon-header { text-align: center; font-size: 32px; margin-bottom: 6px; }
        h2 { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        p.subtitle { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

        .alert-error {
            background: #fef2f2; color: var(--danger); border: 1px solid #fecaca;
            padding: 9px; border-radius: 6px; font-size: 13px; text-align: center; margin-bottom: 14px;
        }

        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; color: #334155; }
        
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }
        input:focus, select:focus { border-color: var(--primary); }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 6px;
        }
        button:hover { background-color: var(--primary-hover); }

        .link-text { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-muted); }
        .link-text a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="icon-header">📡</div>
    <h2>Create Account</h2>
    <p class="subtitle">Register a new profile to access the Messaging Gateway</p>

    {% if error %}
        <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form action="/register" method="POST">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" placeholder="e.g. Mishthi Admin" required>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="e.g. admin1" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="e.g. admin@gateway.local" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a secure password" required>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
        </div>

        <button type="submit">Sign Up</button>
    </form>

    <div class="link-text">
        Already have an account? <a href="/login">Sign In here</a>
    </div>
</div>

</body>
</html>
