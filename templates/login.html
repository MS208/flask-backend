<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Messaging Assistant</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 38px 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
        }

        .icon-header { text-align: center; font-size: 32px; margin-bottom: 6px; }
        h2 { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        p.subtitle { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 22px; }

        .alert-error {
            background: #fef2f2; color: var(--danger); border: 1px solid #fecaca;
            padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; margin-bottom: 16px;
        }
        .alert-success {
            background: #ecfdf5; color: var(--success); border: 1px solid #a7f3d0;
            padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; margin-bottom: 16px;
        }

        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; color: #334155; }
        
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: #fff;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--primary); }

        .remember-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 14px 0 18px 0;
            font-size: 13px;
        }
        .remember-label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #475569; }
        .remember-label input { width: auto; }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }

        .link-text { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-muted); }
        .link-text a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .link-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="icon-header">📡</div>
    <h2>Sign In</h2>
    <p class="subtitle">Access your Smart Messaging Gateway</p>

    {% if error %}
        <div class="alert-error">{{ error }}</div>
    {% endif %}
    {% if success %}
        <div class="alert-success">{{ success }}</div>
    {% endif %}

    <form action="/login" method="POST">
        <div class="form-group">
            <label for="identifier">Username or Email</label>
            <input type="text" id="identifier" name="identifier" placeholder="Enter username or email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="remember-row">
            <label class="remember-label">
                <input type="checkbox" name="remember_me"> Remember this device
            </label>
        </div>

        <button type="submit">Sign In</button>
    </form>

    <div class="link-text">
        Don't have an account? <a href="/register">Create one here</a>
    </div>
</div>

</body>
</html>
